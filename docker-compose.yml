services:
  postgres:
    image: postgres:16-alpine
    container_name: sife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sife
      POSTGRES_PASSWORD: sife
      POSTGRES_DB: sife
    ports:
      - "15432:5432"
    volumes:
      - sife_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sife -d sife"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sife_pgdata:
