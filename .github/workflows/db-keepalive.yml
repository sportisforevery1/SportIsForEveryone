# Paid Render Postgres stays awake without a cron.
# Keep as manual-only so failed pings do not email every 10 minutes.
name: Keep Render Postgres awake

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping production health (DB)
        run: curl -fsS --max-time 25 "https://sportisforeveryone.org/api/health"
