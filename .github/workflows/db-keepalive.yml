name: Keep Render Postgres awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping staging database
        run: curl -fsS --max-time 25 "https://sport-is-for-everyone.vercel.app/api/health"
